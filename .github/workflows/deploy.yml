name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            marine/package-lock.json
            tools/package-lock.json

      - name: Build Marine page
        working-directory: marine
        run: |
          npm ci
          npm run build

      - name: Build Tools page
        working-directory: tools
        run: |
          npm ci
          npm run build

      - name: Assemble Pages website
        shell: bash
        run: |
          mkdir -p site/marine site/tools

          cp index.html site/index.html
          cp -R marine/dist/. site/marine/
          cp -R tools/dist/. site/tools/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4